<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skele Prices Live Dashboard - Large View</title>
    <style>
        body {
            background-color: #060216;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', 'Impact', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 📏 INCREASED: Widened the layout card from 360px to 460px */
        .interface-card {
            width: 460px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-display-box {
            background-color: #8c8c8c;
            border: 4.5px solid #4a1bb3;
            border-radius: 45px;
            width: 100%;
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.3);
        }

        /* 📏 INCREASED: Larger header sizing for the big screen layout */
        .title-text {
            font-style: italic;
            color: #ffffff;
            font-size: 3.2rem;
            margin: 0;
            line-height: 1.05;
            letter-spacing: 0.5px;
            -webkit-text-stroke: 2.5px #000000;
            text-shadow: 5px 5px 0px #000000;
            text-transform: none;
        }

        .title-subtext {
            display: block;
            margin-top: 2px;
            margin-bottom: 30px;
        }

        /* 📏 INCREASED: Expanded the image frame area from 150px to 240px */
        .spawner-frame {
            width: 240px;
            height: 240px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.45));
        }

        .spawner-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .data-panel {
            background-color: #000000;
            border-radius: 40px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.4);
        }

        /* 📏 INCREASED: Bumped font sizing up to match the larger card layout */
        .data-line {
            font-style: italic;
            color: #ffffff;
            font-size: 1.7rem;
            margin: 16px 0;
            line-height: 1.3;
            -webkit-text-stroke: 0.5px #000000;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.5);
            text-align: center;
        }

        .live-value {
            color: #5cf35c;
            font-weight: 900;
            transition: color 0.3s ease;
        }

        .rare-value {
            color: #ff66ff;
            font-weight: 900;
        }

        .currency-block {
            font-size: 1.25rem;
            display: block;
            margin-top: 6px;
            color: #ffa500;
        }
    </style>
</head>
<body>

    <div class="interface-card">
        <div class="top-display-box">
            <h1 class="title-text">Skele prices<span class="title-subtext">live</span></h1>
            
            <div class="spawner-frame">
                <!-- Keep your local image linked here -->
                <img src="spawner.png" alt="Skeleton Spawner">
            </div>
        </div>

        <div class="data-panel">
            <div class="data-line">in game: <span class="live-value" id="ingame-price">$3.5M</span></div>
            <div class="data-line">rarety: <span class="rare-value">LEGACY</span></div>
            <div class="data-line">
                irl: <span class="live-value" id="irl-price">$0.04 USD</span>
                <span class="currency-block" id="converted-prices">($0.06 NZD / $0.06 AUD)</span>
            </div>
        </div>
    </div>

    <script>
        function refreshTickEngine() {
            const baseInGamePrice = 3.5; 
            const gameFluc = (Math.random() * 1.4 - 0.7); 
            const finalGamePrice = (baseInGamePrice + gameFluc).toFixed(1);

            const baseIrlUsd = 0.04;
            const irlFluc = (Math.random() * 0.02 - 0.01);
            const finalIrlUsd = Math.max(0.02, (baseIrlUsd + irlFluc)).toFixed(2);

            const nzdExchangeRate = 1.62;
            const audExchangeRate = 1.54;
            const finalNzd = (finalIrlUsd * nzdExchangeRate).toFixed(2);
            const finalAud = (finalIrlUsd * audExchangeRate).toFixed(2);

            document.getElementById('ingame-price').innerText = `$${finalGamePrice}M`;
            document.getElementById('irl-price').innerText = `$${finalIrlUsd} USD`;
            document.getElementById('converted-prices').innerText = `($${finalNzd} NZD / $${finalAud} AUD)`;
        }

        setInterval(refreshTickEngine, 4000);
        refreshTickEngine();
    </script>

</body>
</html>
